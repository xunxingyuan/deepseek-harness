- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- id: llm-deepseek
  disabled: true
- id: agent-instructions
  disabled: true
- id: session-title-llm
  disabled: true
- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
- id: approval
  config:
    policy: ask
- insert:
    - id: g1brain-workflow-model
      name: './workflow-model.ts'
    - id: g1brain-workflow-integration
      name: '@deepseek-ai/dsh-g1brain-integration'
      config:
        baseUrl: !!js process.env.G1BRAIN_TEST_BASE_URL
        tableBaseUrl: !!js process.env.G1BRAIN_TEST_TABLE_URL || ''
        clientId: 'g1brain-web'
        tenantId: '000000'
        timeoutMs: 5000
