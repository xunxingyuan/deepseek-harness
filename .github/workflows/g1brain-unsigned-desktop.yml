name: G1brain unsigned desktop installers

on:
  push:
    branches:
      - g1brain
    tags:
      - 'g1brain-unsigned-v*'
  workflow_dispatch:
    inputs:
      build_version:
        description: Confirmed full test version, for example 0.2.1-alpha.1.20261014.1
        type: string
        required: true
      target:
        description: Installer platform
        type: choice
        required: true
        default: both
        options:
          - both
          - mac-arm64
          - win-x64

permissions:
  contents: read

concurrency:
  group: g1brain-unsigned-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/g1brain-unsigned-v')
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.resolve.outputs.build_version }}
    steps:
      - name: Resolve explicit version from the tag or manual input
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.build_version }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            case "$REF_NAME" in
              g1brain-unsigned-v*) build_version="${REF_NAME#g1brain-unsigned-v}" ;;
              *) echo 'Unexpected unsigned installer tag' >&2; exit 1 ;;
            esac
          else
            build_version="$REQUESTED_VERSION"
          fi
          if [[ ! "$build_version" =~ ^[0-9A-Za-z.-]+$ ]] || [ "$build_version" = auto ]; then
            echo 'A confirmed full build version using only version characters is required' >&2
            exit 1
          fi
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"

  regression:
    name: G1brain workflow regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify native folder binding and G1brain tools
        run: pnpm exec vitest run packages/g1brain/integration/tests/bindings.spec.ts packages/g1brain/integration/tests/bundle.spec.ts packages/g1brain/integration/tests/materials.spec.ts packages/g1brain/integration/tests/names.spec.ts packages/g1brain/integration/tests/resource-creation.spec.ts packages/g1brain/integration/tests/tool-schema.spec.ts packages/g1brain/integration/tests/session-tools.spec.ts packages/g1brain/integration/tests/integration.spec.ts packages/client/ui-g1brain/tests/home.client.spec.tsx packages/client/ui-g1brain/tests/preparation.client.spec.ts packages/client/ui-plugin-manager/tests/browser-plugin.client.spec.tsx packages/client/ui-schedule/tests/browser-plugin.client.spec.ts
      - name: Build application libraries
        run: pnpm run build:official
      - name: Verify Excel data routing
        run: pnpm exec vitest run packages/g1brain/integration/tests/excel-routing.spec.ts packages/g1brain/integration/tests/table-routing.spec.ts
      - name: Verify G1brain connection settings and sign-out
        run: >-
          pnpm exec vitest run
          apps/desktop/tests/g1brain-auth.spec.ts
          apps/desktop/tests/g1brain-connections.spec.ts
          apps/desktop/tests/welcome-window.spec.ts
          apps/desktop/tests/welcome-renderer.client.spec.tsx
          apps/desktop/tests/welcome-startup.spec.ts
          apps/desktop/tests/main-startup.spec.ts
          apps/desktop/tests/preload-app.spec.ts
          packages/client/ui-g1brain/tests/sign-out.client.spec.tsx
          packages/client/ui-g1brain/tests/registration.client.spec.tsx
      - name: Verify prepared Session through the real Loader
        env:
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e packages/g1brain/integration/tests/workflow.e2e.ts --retry=0
      - name: Replay G1brain guidance Session
        if: runner.os != 'Windows'
        env:
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:snapshot snapshots/session/headless.snapshot.ts -t 'replays g1brain-session-guidance'

  mac-arm64:
    needs: [version, regression]
    if: startsWith(github.ref, 'refs/tags/g1brain-unsigned-v') || (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'mac-arm64'))
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned macOS DMG
        env:
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
        run: pnpm run package:desktop:mac:arm64:unsigned --build-version "$BUILD_VERSION"
      - name: Upload unsigned macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: g1brainxdeepseek-${{ needs.version.outputs.build_version }}-mac-arm64-unsigned
          path: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/g1brainxdeepseek-${{ needs.version.outputs.build_version }}-mac-arm64-unsigned.dmg
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  win-x64:
    needs: [version, regression]
    if: startsWith(github.ref, 'refs/tags/g1brain-unsigned-v') || (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'win-x64'))
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned Windows EXE
        env:
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
        run: pnpm run package:desktop:win:x64:unsigned --build-version $env:BUILD_VERSION
      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: g1brainxdeepseek-${{ needs.version.outputs.build_version }}-win-x64-unsigned
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/g1brainxdeepseek-${{ needs.version.outputs.build_version }}-win-x64-unsigned.exe
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
